[package]
name = "big-head-view"
version = "0.1.0"
edition = "2024"
description = "Spatial UI / 3D floating panel renderer for big-head agents. Hybrid protocol: ViewCommand + A2UI v0.9 content."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures = { workspace = true }
once_cell = "1.20"
big-head-ai = { path = "../big-head-ai" }
big-head-state = { path = "../big-head-state" }

[lints]
workspace = true

[dev-dependencies]
tokio-tungstenite = "0.24"
